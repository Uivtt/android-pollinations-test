name: Build APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle 构建任务'
        required: false
        default: 'assembleDebug'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install SDK components
        run: |
          sdkmanager --install "build-tools;30.0.3" "platforms;android-30"
          echo "SDK installed"

      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Debug project structure
        run: |
          echo "=== Project Structure ==="
          find . -type f -name "*.gradle" -o -name "*.xml" -o -name "*.java" | sort
          echo "=== Gradle Wrapper ==="
          ls -la gradlew gradle/wrapper/
          echo "=== Build Files ==="
          cat build.gradle
          echo "---"
          cat settings.gradle
          echo "---"
          cat app/build.gradle

      - name: Build APK
        run: |
          TASK="${{ inputs.gradle_task || 'assembleDebug' }}"
          echo "Building: $TASK"
          ./gradlew $TASK --no-daemon --stacktrace 2>&1 || {
            echo "BUILD FAILED"
            exit 1
          }
          echo "Build completed successfully"

      - name: Find APKs
        run: |
          echo "=== Looking for APKs ==="
          find . -name "*.apk" -type f 2>/dev/null
          ls -la app/build/outputs/apk/ 2>/dev/null || echo "No apk directory"
          ls -la app/build/outputs/ 2>/dev/null || echo "No outputs directory"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: "**/*.apk"
          retention-days: 7
          if-no-files-found: error

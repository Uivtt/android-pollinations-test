# ============================================================
# Pollinations AI Android App — 远程构建
# 手动触发：GitHub Actions → Run workflow
# ============================================================
name: Build APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle 构建任务'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
      java_version:
        description: 'JDK 版本'
        required: false
        default: '17'
        type: choice
        options: ['17', '21']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Setup JDK ────────────────────────────────────────
      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '${{ inputs.java_version }}'

      # ── 3. Setup Android SDK ────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      # ── 4. 安装缺失的 SDK 组件 ───────────────────────────────
      - name: Install SDK components
        run: |
          sdkmanager --list 2>/dev/null | head -5
          yes | sdkmanager "build-tools;35.0.0" \
                          "platforms;android-34" \
                          "platforms;android-24" 2>/dev/null || true

      # ── 5. Gradle Wrapper 权限 ──────────────────────────────
      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      # ── 6. 缓存 Gradle ──────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── 7. 构建 ─────────────────────────────────────────────
      - name: Build APK
        run: ./gradlew ${{ inputs.gradle_task }} --no-daemon

      # ── 8. 上传构建产物 ─────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload AAB (if built)
        uses: actions/upload-artifact@v4
        with:
          name: aab-release
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 7
          if-no-files-found: warn

      # ── 9. 上传构建日志 ─────────────────────────────────────
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/

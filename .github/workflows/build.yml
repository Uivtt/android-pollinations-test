name: Build APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle 构建任务'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: Install SDK components
        run: |
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33"
          echo "SDK installed successfully"

      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show project structure
        run: find . -name "*.gradle" -o -name "*.xml" -o -name "*.java" | head -30

      - name: Build APK with debug output
        run: |
          ./gradlew ${{ inputs.gradle_task || 'assembleDebug' }} --no-daemon --stacktrace 2>&1 || true
          echo "Build finished"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: app/build/reports/

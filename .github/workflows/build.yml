# Pollinations AI Whisper 测试 — Android 远程构建
name: Build APK

on:
  workflow_dispatch:
    inputs:
      gradle_task:
        description: 'Gradle 构建任务'
        required: false
        default: 'assembleRelease'
        type: choice
        options: [assembleRelease, assembleDebug, bundleRelease]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-licenses: true

      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --install \
            "build-tools;35.0.0" \
            "platforms;android-34" 2>/dev/null || true

      - name: Gradle Wrapper 权限
        run: chmod +x ./gradlew

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}

      - name: 🔨 构建 APK
        run: ./gradlew ${{ github.event.inputs.gradle_task || 'assembleRelease' }} --no-daemon

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: 上传所有 APK
        uses: actions/upload-artifact@v4
        with:
          name: all-apks
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
